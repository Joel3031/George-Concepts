<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="houseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88B04B" />
      <stop offset="100%" stop-color="#134E39" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4435" />
      <stop offset="100%" stop-color="#166556" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Frame (The G Concept Box) -->
  <rect x="75" y="40" width="250" height="250" rx="55" ry="55" fill="none" stroke="url(#frameGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- House Roof & Walls Inside -->
  <!-- Inner House Line -->
  <path d="M 140 185 L 200 130 L 260 185 V 230 C 260 240 252 248 242 248 H 158 C 148 248 140 240 140 230 Z" fill="none" stroke="url(#houseGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Window 4 Panes -->
  <rect x="186" y="186" width="12" height="12" rx="2" fill="#88B04B" />
  <rect x="202" y="186" width="12" height="12" rx="2" fill="#88B04B" />
  <rect x="186" y="202" width="12" height="12" rx="2" fill="#88B04B" />
  <rect x="202" y="202" width="12" height="12" rx="2" fill="#88B04B" />

  <!-- Typography -->
  <!-- CONCEPTS -->
  <text x="200" y="355" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="38" font-weight="800" fill="#76A035" text-anchor="middle" letter-spacing="9">CONCEPTS</text>
  
  <!-- DESIGN STUDIO -->
  <text x="200" y="405" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="24" font-weight="700" fill="#0C3B2E" text-anchor="middle" letter-spacing="7">DESIGN STUDIO</text>
</svg>
